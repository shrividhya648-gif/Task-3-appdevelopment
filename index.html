<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Quote Book</title>

    <style>
         :root {
            --paper: #f3ecdc;
            --gold: #b48a4a;
            --ink: #17130f;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            color: #f8f2e8;
            background: radial-gradient(ellipse at top, #29231d, #11100f 60%, #080808);
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 18px;
        }
        
        .app {
            width: min(1120px, 100%);
        }
        
        header {
            text-align: center;
            margin-bottom: 28px;
        }
        
        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            letter-spacing: .015em;
        }
        
        .subtitle {
            margin-top: 10px;
            color: #c8bba5;
            font-size: 1.1rem;
            font-style: italic;
        }
        
        .ornament {
            color: var(--gold);
            margin-top: 12px;
            font-size: 1.3rem;
            letter-spacing: .5em;
        }
        
        .book-wrap {
            perspective: 1800px;
        }
        
        .book {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            aspect-ratio: 2 / 1;
            min-height: 430px;
            max-height: 540px;
            padding: 8px;
            background: #21170f;
            border-radius: 5px;
            box-shadow: 0 28px 60px #000b, 0 0 0 1px #5d4930;
            isolation: isolate;
        }
        
        .book::before {
            content: "";
            position: absolute;
            z-index: 3;
            top: 8px;
            bottom: 8px;
            left: 50%;
            width: 20px;
            transform: translateX(-50%);
            background: linear-gradient( 90deg, transparent, #3a2617 34%, #140d08 52%, #6c4a2a 72%, transparent);
            pointer-events: none;
        }
        
        .page {
            position: relative;
            min-width: 0;
            overflow: hidden;
            padding: clamp(25px, 5vw, 58px) clamp(20px, 5vw, 54px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--ink);
            background: repeating-linear-gradient( 0deg, #ffffff05 0px, #ffffff05 1px, transparent 1px, transparent 4px), linear-gradient(100deg, #e5dac5, var(--paper) 16%, #f5efdf 82%, #e4d7c0);
        }
        
        .page.left {
            border-radius: 2px 0 0 2px;
            box-shadow: inset -12px 0 18px -18px #382615;
        }
        
        .page.right {
            border-radius: 0 3px 3px 0;
            box-shadow: inset 12px 0 18px -18px #382615;
        }
        
        .eyebrow {
            text-transform: uppercase;
            letter-spacing: .22em;
            color: #6f6250;
            font-size: .76rem;
            margin-bottom: 28px;
        }
        
        .star {
            color: var(--gold);
            font-size: 2.25rem;
            margin-bottom: 25px;
            line-height: 1;
        }
        
        .quote {
            font-size: clamp(1.25rem, 2.7vw, 2rem);
            font-style: italic;
            line-height: 1.5;
            margin: 0;
        }
        
        .left .quote {
            max-width: 480px;
            font-size: clamp(1.2rem, 2.6vw, 1.8rem);
        }
        
        .author {
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: bold;
            color: #59442c;
            margin: 24px 0 0;
        }
        
        .flourish {
            color: #9e7a45;
            font-size: 1.7rem;
            margin-top: 26px;
        }
        
        .right .quote {
            transition: opacity .12s ease;
        }
        
        .right.turning .quote {
            opacity: 0;
        }
        /* The animated sheet that turns over the right page */
        
        .flip-sheet {
            position: absolute;
            z-index: 5;
            top: 8px;
            bottom: 8px;
            left: 50%;
            width: calc(50% - 8px);
            transform-origin: left center;
            transform-style: preserve-3d;
            pointer-events: none;
            opacity: 0;
        }
        
        .flip-sheet.active {
            opacity: 1;
        }
        
        .flip-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: clamp(25px, 5vw, 54px);
            color: var(--ink);
            background: linear-gradient(100deg, #e5dac5, #f5efdf, #e4d7c0);
            box-shadow: inset 10px 0 16px -18px #382615, 5px 5px 14px #0003;
        }
        
        .flip-face.back {
            transform: rotateY(180deg);
            background: linear-gradient(90deg, #d7c8ad, #f0e6d3);
        }
        
        .flip-sheet.forward {
            animation: flipForward .62s ease-in-out forwards;
        }
        
        .flip-sheet.backward {
            transform-origin: right center;
            left: 8px;
            animation: flipBackward .62s ease-in-out forwards;
        }
        
        @keyframes flipForward {
            0% {
                transform: rotateY(0deg);
            }
            45% {
                box-shadow: 0 10px 25px #0006;
            }
            100% {
                transform: rotateY(-180deg);
            }
        }
        
        @keyframes flipBackward {
            0% {
                transform: rotateY(0deg);
            }
            45% {
                box-shadow: 0 10px 25px #0006;
            }
            100% {
                transform: rotateY(180deg);
            }
        }
        /* Buttons */
        
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 28px;
        }
        
        button {
            border: 1px solid #9d7541;
            color: #f7ead4;
            background: linear-gradient(#9b6d39, #694321);
            padding: 13px 22px;
            border-radius: 7px;
            font: 600 1rem Georgia, serif;
            cursor: pointer;
            box-shadow: 0 4px 0 #382313, 0 7px 16px #0005;
            transition: transform .15s, filter .15s;
        }
        
        button:hover {
            filter: brightness(1.13);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        button:focus-visible {
            outline: 2px solid #f5d79d;
            outline-offset: 4px;
        }
        
        .new {
            background: linear-gradient(#b18b4d, #80602f);
        }
        
        .hint {
            text-align: center;
            color: #a99b86;
            font-size: .9rem;
            margin-top: 22px;
        }
        /* Mobile layout */
        
        @media (max-width: 650px) {
            body {
                padding: 22px 12px;
            }
            header {
                margin-bottom: 20px;
            }
            .book {
                grid-template-columns: 1fr;
                aspect-ratio: auto;
                min-height: 0;
                max-height: none;
                padding: 6px;
            }
            .book::before,
            .flip-sheet {
                display: none;
            }
            .page {
                min-height: 270px;
                padding: 32px 25px;
            }
            .page.left {
                border-radius: 3px 3px 0 0;
            }
            .page.right {
                border-radius: 0 0 3px 3px;
            }
            .eyebrow {
                margin-bottom: 17px;
            }
            .star {
                margin-bottom: 15px;
            }
            .flourish {
                margin-top: 15px;
            }
            .controls {
                gap: 10px;
            }
            button {
                padding: 12px 15px;
                font-size: .92rem;
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
                animation-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="app">

        <header>
            <h1>The Quote Book</h1>
            <p class="subtitle">Turn a page. Find your inspiration.</p>
            <div class="ornament">✦ ❧ ✦</div>
        </header>

        <section class="book-wrap" aria-label="Open quote book">
            <div class="book">

                <!-- FIXED LEFT PAGE: NEVER CHANGES -->
                <article class="page left">
                    <div class="eyebrow">A Little Wisdom</div>
                    <div class="star">✦</div>
                    <p class="quote">
                        “In the middle of difficulty lies opportunity.”
                    </p>
                    <div class="flourish">❧</div>
                </article>

                <!-- RIGHT PAGE: QUOTES CHANGE HERE -->
                <article class="page right" id="rightPage" aria-live="polite">
                    <div class="eyebrow">Words to Live By</div>
                    <div class="star">❝</div>
                    <p class="quote" id="quoteText"></p>
                    <p class="author" id="quoteAuthor"></p>
                    <div class="flourish">❧</div>
                </article>

            </div>

            <!-- 3D ANIMATED PAGE -->
            <div class="flip-sheet" id="flipSheet" aria-hidden="true">
                <div class="flip-face front">
                    <div class="eyebrow">Words to Live By</div>
                    <div class="star">❝</div>
                    <p class="quote" id="flipFrontQuote"></p>
                    <p class="author" id="flipFrontAuthor"></p>
                    <div class="flourish">❧</div>
                </div>

                <div class="flip-face back">
                    <div class="eyebrow">A New Page</div>
                    <div class="star">✦</div>
                    <p class="quote" id="flipBackQuote"></p>
                    <p class="author" id="flipBackAuthor"></p>
                    <div class="flourish">❧</div>
                </div>
            </div>
        </section>

        <!-- NAVIGATION BUTTONS -->
        <nav class="controls" aria-label="Quote book controls">
            <button id="previousBtn">← Previous Page</button>
            <button class="new" id="newBtn">✦ New Quote</button>
            <button id="nextBtn">Next Page →</button>
        </nav>

        <p class="hint">
            A collection of words to inspire your next chapter.
        </p>

    </main>

    <script>
        // 30 inspirational quotes, including Indian achievers.
        const quotes = [{
            text: "Dream, dream, dream. Dreams transform into thoughts and thoughts result in action.",
            author: "A. P. J. Abdul Kalam"
        }, {
            text: "Arise, awake, and stop not until the goal is reached.",
            author: "Swami Vivekananda"
        }, {
            text: "You must be the change you wish to see in the world.",
            author: "Mahatma Gandhi"
        }, {
            text: "Where the mind is without fear and the head is held high.",
            author: "Rabindranath Tagore"
        }, {
            text: "Take up one idea. Make that one idea your life.",
            author: "Swami Vivekananda"
        }, {
            text: "A nation's culture resides in the hearts and in the soul of its people.",
            author: "Mahatma Gandhi"
        }, {
            text: "Excellence is a continuous process and not an accident.",
            author: "A. P. J. Abdul Kalam"
        }, {
            text: "Faith is the bird that feels the light when the dawn is still dark.",
            author: "Rabindranath Tagore"
        }, {
            text: "The future depends on what you do today.",
            author: "Mahatma Gandhi"
        }, {
            text: "If you want to shine like a sun, first burn like a sun.",
            author: "A. P. J. Abdul Kalam"
        }, {
            text: "The best way to find yourself is to lose yourself in the service of others.",
            author: "Mahatma Gandhi"
        }, {
            text: "You cannot believe in God until you believe in yourself.",
            author: "Swami Vivekananda"
        }, {
            text: "Let your life lightly dance on the edges of Time like dew on the tip of a leaf.",
            author: "Rabindranath Tagore"
        }, {
            text: "A person who never made a mistake never tried anything new.",
            author: "Albert Einstein"
        }, {
            text: "It always seems impossible until it's done.",
            author: "Nelson Mandela"
        }, {
            text: "The secret of getting ahead is getting started.",
            author: "Mark Twain"
        }, {
            text: "Success is not final, failure is not fatal: it is the courage to continue that counts.",
            author: "Winston Churchill"
        }, {
            text: "Happiness is when what you think, what you say, and what you do are in harmony.",
            author: "Mahatma Gandhi"
        }, {
            text: "Small is the number of people who see with their eyes and think with their minds.",
            author: "Albert Einstein"
        }, {
            text: "Do what you can, with what you have, where you are.",
            author: "Theodore Roosevelt"
        }, {
            text: "The power to question is the basis of all human progress.",
            author: "Indira Gandhi"
        }, {
            text: "You have to dream before your dreams can come true.",
            author: "A. P. J. Abdul Kalam"
        }, {
            text: "A journey of a thousand miles begins with a single step.",
            author: "Lao Tzu"
        }, {
            text: "There is no path to happiness: happiness is the path.",
            author: "Buddha"
        }, {
            text: "Be yourself; everyone else is already taken.",
            author: "Oscar Wilde"
        }, {
            text: "In a gentle way, you can shake the world.",
            author: "Mahatma Gandhi"
        }, {
            text: "The purpose of our lives is to be happy.",
            author: "Dalai Lama"
        }, {
            text: "Great things are done by a series of small things brought together.",
            author: "Vincent van Gogh"
        }, {
            text: "Learning gives creativity, creativity leads to thinking, thinking provides knowledge, and knowledge makes you great.",
            author: "A. P. J. Abdul Kalam"
        }, {
            text: "Where there is love there is life.",
            author: "Mahatma Gandhi"
        }];

        let currentIndex = Math.floor(Math.random() * quotes.length);
        let isAnimating = false;

        const rightPage = document.getElementById("rightPage");
        const quoteText = document.getElementById("quoteText");
        const quoteAuthor = document.getElementById("quoteAuthor");
        const flipSheet = document.getElementById("flipSheet");

        const flipFrontQuote = document.getElementById("flipFrontQuote");
        const flipFrontAuthor = document.getElementById("flipFrontAuthor");
        const flipBackQuote = document.getElementById("flipBackQuote");
        const flipBackAuthor = document.getElementById("flipBackAuthor");

        // Display the quote on the right page.
        function setPage(index) {
            currentIndex = (index + quotes.length) % quotes.length;

            quoteText.textContent = `“${quotes[currentIndex].text}”`;
            quoteAuthor.textContent = `— ${quotes[currentIndex].author}`;
        }

        // Change quotes with a 3D page-turn animation.
        function renderQuote(index, direction = "forward") {
            if (isAnimating) return;

            const nextIndex = (index + quotes.length) % quotes.length;

            if (nextIndex === currentIndex) return;

            // On mobile or when reduced motion is enabled,
            // change the quote without the 3D animation.
            if (
                window.matchMedia("(max-width: 650px)").matches ||
                window.matchMedia("(prefers-reduced-motion: reduce)").matches
            ) {
                setPage(nextIndex);
                return;
            }

            isAnimating = true;

            const oldQuote = quotes[currentIndex];
            const newQuote = quotes[nextIndex];

            flipFrontQuote.textContent = `“${oldQuote.text}”`;
            flipFrontAuthor.textContent = `— ${oldQuote.author}`;

            flipBackQuote.textContent = `“${newQuote.text}”`;
            flipBackAuthor.textContent = `— ${newQuote.author}`;

            flipSheet.className = `flip-sheet active ${direction}`;
            rightPage.classList.add("turning");

            window.setTimeout(() => {
                setPage(nextIndex);
                flipSheet.className = "flip-sheet";
                rightPage.classList.remove("turning");
                isAnimating = false;
            }, 630);
        }

        // Next and previous quote navigation.
        function nextQuote() {
            renderQuote((currentIndex + 1) % quotes.length, "forward");
        }

        function previousQuote() {
            renderQuote(
                (currentIndex - 1 + quotes.length) % quotes.length,
                "backward"
            );
        }

        // Choose a random quote different from the current one.
        function randomQuote() {
            let next;

            do {
                next = Math.floor(Math.random() * quotes.length);
            } while (next === currentIndex);

            renderQuote(
                next,
                Math.random() < 0.5 ? "forward" : "backward"
            );
        }

        // Connect the buttons to their actions.
        document.getElementById("nextBtn")
            .addEventListener("click", nextQuote);

        document.getElementById("previousBtn")
            .addEventListener("click", previousQuote);

        document.getElementById("newBtn")
            .addEventListener("click", randomQuote);

        // Show a random quote whenever the app opens.
        setPage(currentIndex);
    </script>
</body>

</html>
